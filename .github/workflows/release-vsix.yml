name: Build and Release VSIX

on:
  pull_request:
    paths:
      - "auto-comment-extension/**"
      - "scripts/**"
      - ".vscode/**"
      - "install-extension.bat"
      - ".github/workflows/release-vsix.yml"
  push:
    branches: ["main"]
    paths:
      - "auto-comment-extension/**"
      - "scripts/**"
      - ".vscode/**"
      - "install-extension.bat"
      - ".github/workflows/release-vsix.yml"

permissions:
  contents: write

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $files = @(
            'scripts\bootstrap.ps1',
            'scripts\install.ps1',
            'scripts\configure-vscode.ps1',
            'scripts\smart_build.ps1',
            'auto-comment-extension\bootstrap.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Reject machine-specific paths and local VSIX builds
        shell: powershell
        run: |
          $targets = @(
            'install-extension.bat',
            'scripts\bootstrap.ps1',
            'scripts\install.ps1',
            'scripts\configure-vscode.ps1',
            'scripts\smart_build.ps1',
            'auto-comment-extension\bootstrap.ps1',
            'auto-comment-extension\extension.js',
            'auto-comment-extension\entry.js',
            'auto-comment-extension\localization.js'
          )
          $bad = Select-String -Path $targets -Pattern 'C:\\Users\\user|C:\\msys64' -SimpleMatch:$false
          if ($bad) {
            $bad | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber) $($_.Line)" }
            exit 1
          }
          if (Select-String -Path 'install-extension.bat','scripts\install.ps1' -Pattern '\bnpx\b') {
            Write-Error 'Target-machine installer must not depend on npx or local VSIX packaging.'
            exit 1
          }

      - name: Validate portability, startup repair, and multilingual comments
        shell: powershell
        run: |
          $bootstrap = Get-Content -Raw 'scripts\bootstrap.ps1'
          $installer = Get-Content -Raw 'scripts\install.ps1'
          $configure = Get-Content -Raw 'scripts\configure-vscode.ps1'
          $extension = Get-Content -Raw 'auto-comment-extension\extension.js'
          $entry = Get-Content -Raw 'auto-comment-extension\entry.js'
          $localization = Get-Content -Raw 'auto-comment-extension\localization.js'
          $package = Get-Content -Raw 'auto-comment-extension\package.json' | ConvertFrom-Json

          if ($bootstrap -notmatch "ValidateSet\('All', 'Toolchain', 'Node', 'VSCode', 'Python', 'Ripgrep'\)") {
            Write-Error 'Python and Ripgrep must be supported bootstrap components.'
            exit 1
          }

          if ($bootstrap -notmatch 'Python\.PythonInstallManager') {
            Write-Error 'Python Install Manager bootstrap is missing.'
            exit 1
          }

          if ($installer -match '-Components\s+All') {
            Write-Error 'Installer must not eagerly bootstrap every language runtime.'
            exit 1
          }

          if ($installer -notmatch '-Components\s+VSCode') {
            Write-Error 'Installer must prepare the VS Code host.'
            exit 1
          }

          if ($installer -notmatch '-Components\s+Python') {
            Write-Error 'Installer must verify and repair Python during setup so external runners inherit a usable PATH.'
            exit 1
          }

          if ($extension -notmatch "ext === '\.py'") {
            Write-Error 'Python file-extension language detection is missing.'
            exit 1
          }

          if ($extension -notmatch "component = 'Python'") {
            Write-Error 'Python lazy runtime fallback is missing.'
            exit 1
          }

          if ($extension -notmatch "path\.join\(pythonRoot, 'Launcher', 'py\.exe'\)") {
            Write-Error 'Extension must discover the standard per-user Python launcher outside PATH.'
            exit 1
          }

          if ($extension -notmatch 'executable: runtime\.interpreter') {
            Write-Error 'Python commands must normalize to the verified interpreter absolute path.'
            exit 1
          }

          if ($bootstrap -notmatch "Programs\\Python\\Launcher\\py\.exe") {
            Write-Error 'Bootstrap must discover the per-user Python launcher outside PATH.'
            exit 1
          }

          if ($bootstrap -notmatch 'Add-UserPath \(Split-Path \$runtime\.Launcher -Parent\)') {
            Write-Error 'Bootstrap must persist the Python launcher directory to User PATH.'
            exit 1
          }

          if ($bootstrap -notmatch 'Add-UserPath \(Split-Path \$runtime\.Interpreter -Parent\)') {
            Write-Error 'Bootstrap must persist the verified Python interpreter directory to User PATH.'
            exit 1
          }

          if ($configure -notmatch 'function Find-PythonInterpreter') {
            Write-Error 'VS Code support repair must independently resolve the verified Python interpreter.'
            exit 1
          }

          if ($configure -notmatch "PropertyName 'python\.defaultInterpreterPath'") {
            Write-Error 'VS Code Python default interpreter configuration is missing.'
            exit 1
          }

          if ($package.activationEvents -contains 'onStartupFinished') {
            Write-Error 'Extension must not activate on every VS Code startup.'
            exit 1
          }

          if ($bootstrap -notmatch 'BurntSushi\.ripgrep\.MSVC') {
            Write-Error 'Portable ripgrep bootstrap is missing.'
            exit 1
          }

          if ($installer -match '-Components\s+Ripgrep') {
            Write-Error 'Installer must not bootstrap external ripgrep for Better Todo Tree.'
            exit 1
          }

          if ($configure -notmatch "Remove-ExtensionIfPresent 'Gruntfuggly\.todo-tree'") {
            Write-Error 'Legacy Todo Tree removal is missing.'
            exit 1
          }

          if ($configure -notmatch "Ensure-Extension 'FanaticPythoner\.better-todo-tree'") {
            Write-Error 'Maintained Better Todo Tree setup is missing.'
            exit 1
          }

          if ($configure -notmatch "Remove-JsoncStringProperty.*better-todo-tree\.ripgrep\.ripgrep") {
            Write-Error 'Better Todo Tree ripgrep override cleanup is missing.'
            exit 1
          }

          if ($configure -notmatch 'ms-python\.vscode-pylance') {
            Write-Error 'Pylance setup is missing.'
            exit 1
          }

          if ($configure -notmatch 'TabNine\.tabnine-vscode') {
            Write-Error 'Legacy Tabnine cleanup is missing.'
            exit 1
          }

          if ($package.main -ne './entry.js') {
            Write-Error 'Multilingual entry point must be the extension main module.'
            exit 1
          }

          if ($package.activationEvents -notcontains 'onCommand:autoCommentAfterRun.changeCommentLanguage') {
            Write-Error 'Change Comment Language command activation is missing.'
            exit 1
          }

          if ($package.activationEvents -notcontains 'onCommand:autoCommentAfterRun.resetCommentLanguage') {
            Write-Error 'Reset Comment Language command activation is missing.'
            exit 1
          }

          if ($entry -notmatch 'globalState\.get\(LANGUAGE_STATE_KEY\)') {
            Write-Error 'First-run language preference must be read from VS Code globalState.'
            exit 1
          }

          if ($entry -notmatch 'globalState\.update\(LANGUAGE_STATE_KEY') {
            Write-Error 'Selected comment language must persist in VS Code globalState.'
            exit 1
          }

          if ($entry -notmatch 'showQuickPick') {
            Write-Error 'First-run comment language picker is missing.'
            exit 1
          }

          if ($entry -notmatch 'Other / Custom language or locale') {
            Write-Error 'Custom BCP 47 locale selection is missing.'
            exit 1
          }

          if ($entry -notmatch 'translateGeneratedComment') {
            Write-Error 'Generated comment translation hook is missing.'
            exit 1
          }

          $requiredLocales = @(
            'ko-KR','en-US','ja-JP','zh-CN','zh-TW','fr-FR','de-DE',
            'es-MX','pt-BR','ru-RU','ar-SA','hi-IN','vi-VN'
          )
          foreach ($locale in $requiredLocales) {
            if ($localization -notmatch [Regex]::Escape("'$locale'")) {
              Write-Error "Required comment locale is missing: $locale"
              exit 1
            }
          }

  package:
    needs: windows-smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto-comment-extension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=auto-comment-after-run-$VERSION.vsix" >> "$GITHUB_OUTPUT"

      - name: Validate extension JavaScript
        shell: bash
        run: |
          node --check extension.js
          node --check entry.js
          node --check localization.js

      - name: Package VSIX
        shell: bash
        run: npx --yes @vscode/vsce package --out "${{ steps.version.outputs.vsix }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: "auto-comment-after-run-${{ steps.version.outputs.version }}"
          path: "auto-comment-extension/${{ steps.version.outputs.vsix }}"

      - name: Create or update GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
          VERSION: "${{ steps.version.outputs.version }}"
          VSIX: "${{ steps.version.outputs.vsix }}"
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$VSIX" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Auto Comment v$VERSION" \
              --notes "Adds a first-run persistent comment-language picker, multilingual generated learning comments, change/reset language commands, BCP 47 custom locale input, and keeps the external-PC Python/PATH repairs from v0.0.16."
          fi
